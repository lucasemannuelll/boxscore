<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0b1020" />
    <title>BoxScore</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo">🏀</div>
        <h1>Box<span>Score</span></h1>
      </header>

      <div class="addbar">
        <input
          id="nameInput"
          type="text"
          placeholder="Nome…"
          maxlength="24"
          autocomplete="off"
        />
        <button class="btn" id="addBtn">Add</button>
      </div>

      <div class="tablecard">
        <table>
          <thead>
            <tr>
              <th style="text-align: left; padding-left: 10px">Player</th>
              <th>FG</th>
              <th>3P</th>
              <th>FG%</th>
              <th>PTS</th>
              <th>AST</th>
            </tr>
          </thead>
          <tbody id="playersTableBody"></tbody>
          <tfoot id="playersTableFooter"></tfoot>
        </table>
        <div class="empty" id="emptyStateMessage">
          Nenhum jogador ainda — adicione um acima e toque em uma linha para registrar estatísticas.
        </div>
      </div>

      <div class="toolbar">
        <button class="btn ghost" id="resetSessionBtn">Reiniciar Sessão</button>
      </div>
    </div>

    <!-- Bottom sheet editor -->
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet" id="playerStatsSheet">
      <div class="grab"></div>
      <h2 id="sheetPlayerName">Jogador</h2>
      <div class="sub" id="sheetSummaryLine"></div>

      <div class="statgroup">
        <div class="gtitle">
          <b>2-PONTOS</b
          ><span class="val"><b id="twoPointersMadeValue">0</b>/<span id="twoPointersAttemptedValue">0</span></span>
        </div>
        <div class="btnrow">
          <button class="bigbtn make" data-stat="twoPointersMade">
            + Convertido<small>conta tentativa</small>
          </button>
          <button class="bigbtn miss" data-stat="twoPointersAttempted">+ Errado</button>
          <button class="bigbtn undo" data-undo="twoPointers">−1</button>
        </div>
      </div>

      <div class="statgroup">
        <div class="gtitle">
          <b>3-PONTOS</b
          ><span class="val"><b id="threePointersMadeValue">0</b>/<span id="threePointersAttemptedValue">0</span></span>
        </div>
        <div class="btnrow">
          <button class="bigbtn make" data-stat="threePointersMade">
            + Convertido<small>conta tentativa</small>
          </button>
          <button class="bigbtn miss" data-stat="threePointersAttempted">+ Errado</button>
          <button class="bigbtn undo" data-undo="threePointers">−1</button>
        </div>
      </div>

      <div class="statgroup">
        <div class="gtitle">
          <b>ASSISTÊNCIAS</b><span class="val"><b id="assistsValue">0</b></span>
        </div>
        <div class="btnrow">
          <button class="bigbtn ast" data-stat="assists">+ Assistência</button>
          <button class="bigbtn undo" data-undo="assists">−1</button>
        </div>
      </div>

      <button class="btn ghost closebtn" id="closeSheetBtn">Fechar</button>
      <button class="btn danger delbtn" id="deletePlayerBtn">Remover jogador</button>
    </div>
  </body>
</html>
