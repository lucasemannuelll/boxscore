<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0b1020" />
    <title>BoxScore · one file</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #141b33;
        --panel2: #1b2444;
        --line: #2a355e;
        --text: #eef2ff;
        --muted: #8b96c0;
        --accent: #e94560;
        --accent2: #4e9cff;
        --good: #2ecc71;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        overscroll-behavior: none;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 12px 10px 90px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      header .logo {
        font-size: 24px;
      }
      header h1 {
        font-size: 18px;
        margin: 0;
        letter-spacing: 1px;
        text-transform: uppercase;
        flex: 1;
      }
      header h1 span {
        color: var(--accent);
      }

      .addbar {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .addbar input {
        flex: 1;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        color: var(--text);
        font-size: 16px;
        outline: none;
      }
      .addbar input:focus {
        border-color: var(--accent2);
      }
      .btn {
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        color: #fff;
        background: var(--accent2);
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn.danger {
        background: #3a2430;
        color: #ff7a93;
        border: 1px solid #5b2f42;
      }
      .btn.ghost {
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--muted);
      }

      /* ---------- NBA-style box score table ---------- */
      .tablecard {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      thead th {
        background: #0e1430;
        color: var(--muted);
        font-weight: 700;
        text-transform: uppercase;
        font-size: 10.5px;
        letter-spacing: 0.5px;
        padding: 9px 4px;
        border-bottom: 2px solid var(--accent);
        position: sticky;
        top: 0;
        white-space: nowrap;
      }
      tbody td {
        padding: 10px 4px;
        text-align: center;
        border-bottom: 1px solid var(--line);
        font-variant-numeric: tabular-nums;
      }
      tbody tr:nth-child(even) {
        background: rgba(255, 255, 255, 0.025);
      }
      tbody tr.player {
        cursor: pointer;
      }
      tbody tr.player:active {
        background: var(--panel2);
      }
      td.name {
        text-align: left;
        padding-left: 10px;
        font-weight: 700;
        white-space: nowrap;
        max-width: 110px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      td.name small {
        display: block;
        color: var(--muted);
        font-weight: 400;
        font-size: 10px;
      }
      td.pts {
        font-weight: 800;
        color: var(--accent);
        font-size: 15px;
      }
      td.ast {
        color: var(--accent2);
        font-weight: 700;
      }
      tfoot td {
        padding: 10px 4px;
        text-align: center;
        font-weight: 800;
        background: #0e1430;
        border-top: 2px solid var(--accent);
        font-variant-numeric: tabular-nums;
      }
      tfoot td.name {
        text-align: left;
        padding-left: 10px;
        color: var(--muted);
      }
      .empty {
        padding: 28px 12px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .toolbar .btn {
        flex: 1;
      }

      /* ---------- Bottom-sheet stat editor ---------- */
      .sheet-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(2px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s;
        z-index: 40;
      }
      .sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        max-width: 720px;
        margin: 0 auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-bottom: none;
        border-radius: 20px 20px 0 0;
        padding: 14px 14px calc(16px + env(safe-area-inset-bottom));
        transform: translateY(105%);
        transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
        z-index: 50;
        max-height: 86vh;
        overflow-y: auto;
      }
      .sheet.open {
        transform: translateY(0);
      }
      .sheet-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      .grab {
        width: 44px;
        height: 5px;
        border-radius: 3px;
        background: var(--line);
        margin: 0 auto 12px;
      }
      .sheet h2 {
        margin: 0 0 2px;
        font-size: 19px;
      }
      .sheet .sub {
        color: var(--muted);
        font-size: 12.5px;
        margin-bottom: 14px;
      }

      .statgroup {
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        margin-bottom: 10px;
      }
      .statgroup .gtitle {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 10px;
      }
      .statgroup .gtitle b {
        font-size: 14px;
        letter-spacing: 0.5px;
      }
      .statgroup .gtitle .val {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        font-size: 13px;
      }
      .gtitle .val b {
        color: var(--text);
        font-size: 15px;
      }
      .btnrow {
        display: flex;
        gap: 8px;
      }
      .bigbtn {
        flex: 1;
        border: none;
        border-radius: 12px;
        padding: 16px 6px;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .bigbtn small {
        font-weight: 400;
        font-size: 10.5px;
        opacity: 0.75;
      }
      .bigbtn:active {
        transform: scale(0.95);
      }
      .bigbtn.make {
        background: linear-gradient(135deg, #1f8f52, #2ecc71);
      }
      .bigbtn.miss {
        background: linear-gradient(135deg, #8f1f2f, #e94560);
      }
      .bigbtn.undo {
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--muted);
        flex: 0 0 74px;
        justify-content: center;
      }
      .bigbtn.ast {
        background: linear-gradient(135deg, #2456a8, #4e9cff);
      }
      .sheet .closebtn {
        width: 100%;
        margin-top: 4px;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .sheet .delbtn {
        width: 100%;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo">🏀</div>
        <h1>Box<span>Score</span></h1>
      </header>

      <div class="addbar">
        <input
          id="nameInput"
          type="text"
          placeholder="Nome…"
          maxlength="24"
          autocomplete="off"
        />
        <button class="btn" id="addBtn">Add</button>
      </div>

      <div class="tablecard">
        <table>
          <thead>
            <tr>
              <th style="text-align: left; padding-left: 10px">Player</th>
              <th>FG</th>
              <th>3P</th>
              <th>FG%</th>
              <th>PTS</th>
              <th>AST</th>
            </tr>
          </thead>
          <tbody id="playersTableBody"></tbody>
          <tfoot id="playersTableFooter"></tfoot>
        </table>
        <div class="empty" id="emptyStateMessage">
          Nenhum jogador ainda — adicione um acima e toque em uma linha para registrar estatísticas.
        </div>
      </div>

      <div class="toolbar">
        <button class="btn ghost" id="resetSessionBtn">Reiniciar Sessão</button>
      </div>
    </div>

    <!-- Bottom sheet editor -->
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet" id="playerStatsSheet">
      <div class="grab"></div>
      <h2 id="sheetPlayerName">Jogador</h2>
      <div class="sub" id="sheetSummaryLine"></div>

      <div class="statgroup">
        <div class="gtitle">
          <b>2-PONTOS</b
          ><span class="val"><b id="twoPointersMadeValue">0</b>/<span id="twoPointersAttemptedValue">0</span></span>
        </div>
        <div class="btnrow">
          <button class="bigbtn make" data-stat="twoPointersMade">
            + Convertido<small>conta tentativa</small>
          </button>
          <button class="bigbtn miss" data-stat="twoPointersAttempted">+ Errado</button>
          <button class="bigbtn undo" data-undo="twoPointers">−1</button>
        </div>
      </div>

      <div class="statgroup">
        <div class="gtitle">
          <b>3-PONTOS</b
          ><span class="val"><b id="threePointersMadeValue">0</b>/<span id="threePointersAttemptedValue">0</span></span>
        </div>
        <div class="btnrow">
          <button class="bigbtn make" data-stat="threePointersMade">
            + Convertido<small>conta tentativa</small>
          </button>
          <button class="bigbtn miss" data-stat="threePointersAttempted">+ Errado</button>
          <button class="bigbtn undo" data-undo="threePointers">−1</button>
        </div>
      </div>

      <div class="statgroup">
        <div class="gtitle">
          <b>ASSISTÊNCIAS</b><span class="val"><b id="assistsValue">0</b></span>
        </div>
        <div class="btnrow">
          <button class="bigbtn ast" data-stat="assists">+ Assistência</button>
          <button class="bigbtn undo" data-undo="assists">−1</button>
        </div>
      </div>

      <button class="btn ghost closebtn" id="closeSheetBtn">Fechar</button>
      <button class="btn danger delbtn" id="deletePlayerBtn">Remover jogador</button>
    </div>

    <script>
      (function () {
        "use strict";

        const LOCAL_STORAGE_KEY = "playerV1";
        let players = [];

        try {
          players = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY)) || [];
        } catch (parseError) {
          players = [];
        }

        let selectedPlayerId = null;

        function savePlayersToStorage() {
          try {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(players));
          } catch (storageError) {}
        }

        function escapeHtmlCharacters(rawString) {
          return String(rawString).replace(/[&<>"']/g, function (char) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[char];
          });
        }

        function calculatePlayerTotals(player) {
          return {
            fieldGoalsMade: player.twoPointersMade + player.threePointersMade,
            fieldGoalsAttempted:
              player.twoPointersAttempted + player.threePointersAttempted,
            pointsScored: 2 * player.twoPointersMade + 3 * player.threePointersMade,
          };
        }

        function getSelectedPlayer() {
          return (
            players.find(function (player) {
              return player.id === selectedPlayerId;
            }) || null
          );
        }

        function renderPlayerStatsTable() {
          const tableBody = document.getElementById("playersTableBody");
          const tableFooter = document.getElementById("playersTableFooter");
          const emptyStateMessage = document.getElementById("emptyStateMessage");
          tableBody.innerHTML = "";
          const overallTotals = {
            fieldGoalsMade: 0,
            fieldGoalsAttempted: 0,
            threePointersMade: 0,
            threePointersAttempted: 0,
            pointsScored: 0,
            assists: 0,
          };

          players.forEach(function (player) {
            const playerTotals = calculatePlayerTotals(player);
            const fieldGoalPercentage = playerTotals.fieldGoalsAttempted
              ? ((100 * playerTotals.fieldGoalsMade) /
                  playerTotals.fieldGoalsAttempted
                ).toFixed(1)
              : "0.0";
            const tableRow = document.createElement("tr");
            tableRow.className = "player";
            tableRow.dataset.id = player.id;
            tableRow.innerHTML = `
            <td class="name">${escapeHtmlCharacters(
              player.name
            )}<small>tap to log</small></td>
            <td>${playerTotals.fieldGoalsMade}/${
              playerTotals.fieldGoalsAttempted
            }</td>
            <td>${player.threePointersMade}/${
              player.threePointersAttempted
            }</td>
            <td>${fieldGoalPercentage}</td>
            <td class="pts">${playerTotals.pointsScored}</td>
            <td class="ast">${player.assists}</td>
          `;
            tableBody.appendChild(tableRow);

            overallTotals.fieldGoalsMade += playerTotals.fieldGoalsMade;
            overallTotals.fieldGoalsAttempted += playerTotals.fieldGoalsAttempted;
            overallTotals.threePointersMade += player.threePointersMade;
            overallTotals.threePointersAttempted += player.threePointersAttempted;
            overallTotals.pointsScored += playerTotals.pointsScored;
            overallTotals.assists += player.assists;
          });

          emptyStateMessage.style.display = players.length ? "none" : "block";

          const overallFieldGoalPercentage = overallTotals.fieldGoalsAttempted
            ? ((100 * overallTotals.fieldGoalsMade) /
                overallTotals.fieldGoalsAttempted
              ).toFixed(1)
            : "0.0";
          tableFooter.innerHTML =
            "<tr>" +
            '<td class="name">TOTALS</td>' +
            "<td>" +
            overallTotals.fieldGoalsMade +
            "/" +
            overallTotals.fieldGoalsAttempted +
            "</td>" +
            "<td>" +
            overallTotals.threePointersMade +
            "/" +
            overallTotals.threePointersAttempted +
            "</td>" +
            "<td>" +
            overallFieldGoalPercentage +
            "</td>" +
            '<td class="pts">' +
            overallTotals.pointsScored +
            "</td>" +
            '<td class="ast">' +
            overallTotals.assists +
            "</td>" +
            "</tr>";
        }

        function addPlayer() {
          const nameInputElement = document.getElementById("nameInput");
          const cleanedPlayerName = nameInputElement.value.trim();
          if (!cleanedPlayerName) return;

          players.push({
            id: Date.now() + "_" + Math.random().toString(36).slice(2, 7),
            name: cleanedPlayerName,
            twoPointersMade: 0,
            twoPointersAttempted: 0,
            threePointersMade: 0,
            threePointersAttempted: 0,
            assists: 0,
          });

          nameInputElement.value = "";
          savePlayersToStorage();
          renderPlayerStatsTable();
          nameInputElement.focus();
        }

        document.getElementById("addBtn").addEventListener("click", addPlayer);
        document.getElementById("nameInput").addEventListener("keydown", function (e) {
          if (e.key === "Enter") addPlayer();
        });

        document
          .getElementById("resetSessionBtn")
          .addEventListener("click", function () {
            if (!players.length) return;
            if (confirm("Reset all stats to zero? Players will be kept.")) {
              players.forEach(function (player) {
                player.twoPointersMade = 0;
                player.twoPointersAttempted = 0;
                player.threePointersMade = 0;
                player.threePointersAttempted = 0;
                player.assists = 0;
              });
              savePlayersToStorage();
              renderPlayerStatsTable();
            }
          });

        const statsSheetElement = document.getElementById("playerStatsSheet");
        const backdropElement = document.getElementById("sheetBackdrop");

        function refreshPlayerStatsSheet() {
          const selectedPlayer = getSelectedPlayer();
          if (!selectedPlayer) return;
          document.getElementById("sheetPlayerName").textContent = selectedPlayer.name;

          const playerTotals = calculatePlayerTotals(selectedPlayer);
          document.getElementById("sheetSummaryLine").textContent =
            playerTotals.pointsScored +
            " PTS · " +
            playerTotals.fieldGoalsMade +
            "/" +
            playerTotals.fieldGoalsAttempted +
            " FG · " +
            selectedPlayer.assists +
            " AST";

          document.getElementById("twoPointersMadeValue").textContent =
            selectedPlayer.twoPointersMade;
          document.getElementById("twoPointersAttemptedValue").textContent =
            selectedPlayer.twoPointersAttempted;
          document.getElementById("threePointersMadeValue").textContent =
            selectedPlayer.threePointersMade;
          document.getElementById("threePointersAttemptedValue").textContent =
            selectedPlayer.threePointersAttempted;
          document.getElementById("assistsValue").textContent =
            selectedPlayer.assists;
        }

        function openPlayerStatsSheet(playerId) {
          selectedPlayerId = playerId;
          refreshPlayerStatsSheet();
          statsSheetElement.classList.add("open");
          backdropElement.classList.add("open");
        }

        function closePlayerStatsSheet() {
          statsSheetElement.classList.remove("open");
          backdropElement.classList.remove("open");
          selectedPlayerId = null;
          renderPlayerStatsTable();
        }

        document
          .getElementById("playersTableBody")
          .addEventListener("click", function (e) {
            const row = e.target.closest("tr.player");
            if (row) openPlayerStatsSheet(row.dataset.id);
          });

        document
          .getElementById("closeSheetBtn")
          .addEventListener("click", closePlayerStatsSheet);
        backdropElement.addEventListener("click", closePlayerStatsSheet);

        document
          .getElementById("deletePlayerBtn")
          .addEventListener("click", function () {
            const selectedPlayer = getSelectedPlayer();
            if (!selectedPlayer) return;

            if (
              confirm('Remove "' + selectedPlayer.name + '" and all their stats?')
            ) {
              players = players.filter(function (player) {
                return player.id !== selectedPlayer.id;
              });
              savePlayersToStorage();
              closePlayerStatsSheet();
            }
          });

        statsSheetElement.addEventListener("click", function (e) {
          const clickedButton = e.target.closest("button");
          if (!clickedButton) return;

          const selectedPlayer = getSelectedPlayer();
          if (!selectedPlayer) return;

          const statToIncrement = clickedButton.dataset.stat;
          const statToUndo = clickedButton.dataset.undo;

          if (statToIncrement === "twoPointersMade") {
            selectedPlayer.twoPointersMade++;
            selectedPlayer.twoPointersAttempted++;
          } else if (statToIncrement === "twoPointersAttempted") {
            selectedPlayer.twoPointersAttempted++;
          } else if (statToIncrement === "threePointersMade") {
            selectedPlayer.threePointersMade++;
            selectedPlayer.threePointersAttempted++;
          } else if (statToIncrement === "threePointersAttempted") {
            selectedPlayer.threePointersAttempted++;
          } else if (statToIncrement === "assists") {
            selectedPlayer.assists++;
          } else if (statToUndo === "twoPointers") {
            if (selectedPlayer.twoPointersMade > 0) {
              selectedPlayer.twoPointersMade--;
              selectedPlayer.twoPointersAttempted--;
            } else if (selectedPlayer.twoPointersAttempted > 0) {
              selectedPlayer.twoPointersAttempted--;
            }
          } else if (statToUndo === "threePointers") {
            if (selectedPlayer.threePointersMade > 0) {
              selectedPlayer.threePointersMade--;
              selectedPlayer.threePointersAttempted--;
            } else if (selectedPlayer.threePointersAttempted > 0) {
              selectedPlayer.threePointersAttempted--;
            }
          } else if (statToUndo === "assists" && selectedPlayer.assists > 0) {
            selectedPlayer.assists--;
          }

          savePlayersToStorage();
          refreshPlayerStatsSheet();
          renderPlayerStatsTable();
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") closePlayerStatsSheet();
        });

        renderPlayerStatsTable();
      })();
    </script>
  </body>
</html>
